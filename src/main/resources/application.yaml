spring:
  application:
    name: BlackHoleTourismAgencyBook

  datasource:
    url: jdbc:postgresql://localhost:5432/agency_db
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    org.flywaydb: DEBUG